# Number of HTTP server Pods. Keep at least two for rolling upgrades.
replicaCount: 2

image:
  # Override the tag for immutable deployments; the chart appVersion is used
  # when this value is empty.
  repository: ghcr.io/thomasilliet/gfw
  pullPolicy: IfNotPresent
  tag: ""
# References to registry credentials in the release namespace.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The application does not call the Kubernetes API, so token mounting stays
  # disabled even when the chart creates the ServiceAccount.
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  # These defaults match the non-root UID/GID used by the container image.
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  # Container hardening defaults are intentionally restrictive.
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  # The Ingress targets this Service; NodePort and LoadBalancer also work when
  # explicitly selected.
  type: ClusterIP
  port: 80
  metricsPort: 9090
  annotations: {}

ingress:
  # Configure tls and the matching host when exposing GFW publicly.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gfw.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  # public_url and oidc_redirect_url must be browser-visible URLs. Development
  # authentication is prohibited by the chart schema.
  environment: production
  listen_address: ":8080"
  metrics_listen_address: ":9090"
  public_url: "https://gfw.example.com"
  frontend_dir: "/app/frontend/.output/public"
  oidc_issuer: "https://identity.example.com"
  oidc_client_id: "great-firewall"
  oidc_redirect_url: "https://gfw.example.com/auth/callback"
  dev_auth: false
  dns_interval: 15m
  dns_timeout: 5s
  retention_days: 365

# The chart intentionally deploys no PostgreSQL workload. Prefer an existing
# Secret for the externally managed database and authentication credentials.
secrets:
  # existingSecret is recommended in production. When set, inline values below
  # are ignored and keys maps GFW settings to Secret data keys.
  existingSecret: ""
  keys:
    databaseURL: database-url
    oidcClientSecret: oidc-client-secret
    sessionSecret: session-secret
    adminToken: admin-token
  databaseURL: ""
  oidcClientSecret: ""
  sessionSecret: ""
  adminToken: ""

migration:
  # Runs `gfw migrate up` as a pre-install/pre-upgrade Helm hook.
  enabled: true
  backoffLimit: 4
  ttlSecondsAfterFinished: 600

resources:
  # Defaults suit a small installation; tune from observed traffic and DNS load.
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

probes:
  # Readiness checks PostgreSQL connectivity; liveness checks the process only.
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6

podDisruptionBudget:
  # With replicaCount: 1, disable this or set maxUnavailable instead.
  enabled: true
  minAvailable: 1

tmp:
  # Writable scratch space available while the root filesystem is read-only.
  sizeLimit: 64Mi

nodeSelector: {}
tolerations: []
# Prefer spreading replicas across nodes without making scheduling mandatory.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gfw

topologySpreadConstraints: []
priorityClassName: ""
# Must remain longer than the server's 15-second graceful-shutdown timeout.
terminationGracePeriodSeconds: 30

