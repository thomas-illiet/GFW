{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gfw.fullname" . }}
  labels:
    {{- include "gfw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseURL }}: {{ required "secrets.databaseURL is required when secrets.existingSecret is empty" .Values.secrets.databaseURL | quote }}
  {{ .Values.secrets.keys.oidcClientSecret }}: {{ required "secrets.oidcClientSecret is required when secrets.existingSecret is empty" .Values.secrets.oidcClientSecret | quote }}
  {{ .Values.secrets.keys.sessionSecret }}: {{ required "secrets.sessionSecret is required when secrets.existingSecret is empty" .Values.secrets.sessionSecret | quote }}
{{- end }}

