services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gfw
      POSTGRES_USER: gfw
      POSTGRES_PASSWORD: gfw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gfw"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["${GFW_POSTGRES_PORT:-5432}:5432"]
    volumes: ["gfw-data:/var/lib/postgresql/data"]
  great-firewall:
    build: .
    environment:
      GFW_DATABASE_URL: postgres://gfw:gfw@postgres:5432/gfw?sslmode=disable
      GFW_PUBLIC_URL: http://localhost:8080
      GFW_DEV_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: ["${GFW_HTTP_PORT:-8080}:8080"]
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      GFW_DATABASE_URL: postgres://gfw:gfw@postgres:5432/gfw?sslmode=disable
      GFW_DEV_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  gfw-data: {}
